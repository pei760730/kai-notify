# Keep GitHub Actions current automatically.
#
# Why this file exists: on 2026-07-26 a fleet-wide scan found 25 of 26 repos had
# no dependabot at all, and every one of them was a full MAJOR version behind on
# actions/checkout, setup-python and friends. A moving tag like `@v5` only moves
# inside its own major line — once v6 ships, `@v5` is frozen and nothing says so.
#
# Schedule: dependabot has no "biweekly" interval, and cron has no week-parity
# field either, so "every two weeks" is expressed as the 1st and 15th. Fixed
# dates on purpose — a true 14-day cycle drifts across weekdays over time.
#
# grouped on purpose: the default (one PR per action) turns into a drizzle of
# PRs to triage. One bundled PR per run is reviewable in a single pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Added 2026-09-06. github-actions was the only ecosystem here, so the Python
  # dev tooling in python/pyproject.toml had nothing watching it — ruff sat on
  # 0.16.0 there while CI's own inline pin said 0.16.4 and neither was tracked.
  # (Verified against this repo's dependency graph: it reports ruff 0.16.0, the
  # manifest value, proving the workflow's inline pin is invisible.)
  # directory is /python because that is where the manifest lives.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
