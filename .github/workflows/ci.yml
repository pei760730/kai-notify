name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quota discipline: never run two of the same ref's CI at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # ruff over both the package and the standalone scripts (fleet_digest lives
    # outside the package, so lint from the repo root to cover it too).
    runs-on: ubuntu-latest
    # 實測最長 0.2 分(近 20 次成功);不設就是吃 360 分鐘預設
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff 的版本釘在 python/pyproject.toml 的 dev extra(唯一來源),不在這裡
      # 內嵌 —— 寫在 run: 裡的 pin 對 dependabot 是隱形的,而且會跟 manifest 漂開。
      - run: pip install -e "./python[dev]"
      - run: ruff check python scripts
      - run: ruff format --check python scripts

  python:
    runs-on: ubuntu-latest
    # 實測最長 0.3 分(近 20 次成功);不設就是吃 360 分鐘預設
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"   # also validates the pip-installable path
      - run: pytest -q

  action-selftest:
    # Proves action.yml is valid and fail-soft: with no token it must skip and
    # still succeed (exit 0), never breaking a caller's workflow.
    runs-on: ubuntu-latest
    # 實測最長 0.1 分(近 20 次成功);不設就是吃 360 分鐘預設
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No credentials -> skips, job stays green
        uses: ./
        with:
          text: "selftest (should be skipped, no secret in CI)"
