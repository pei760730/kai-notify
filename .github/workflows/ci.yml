name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quota discipline: never run two of the same ref's CI at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # ruff over both the package and the standalone scripts (fleet_digest lives
    # outside the package, so lint from the repo root to cover it too).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check python scripts
      - run: ruff format --check python scripts

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"   # also validates the pip-installable path
      - run: pytest -q

  action-selftest:
    # Proves action.yml is valid and fail-soft: with no token it must skip and
    # still succeed (exit 0), never breaking a caller's workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials -> skips, job stays green
        uses: ./
        with:
          text: "selftest (should be skipped, no secret in CI)"
