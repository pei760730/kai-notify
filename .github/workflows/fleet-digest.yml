name: fleet-digest

# 每天一則全 fleet cron 健康摘要 + heartbeat。見 scripts/fleet_digest.py 開頭說明。
# 沒收到這則 = 通知管線死了(fail-soft 的靜音盲區靠這支戳破)。
on:
  schedule:
    - cron: "0 23 * * *" # 07:00 Asia/Taipei
  workflow_dispatch: {}

# contents:write 是為了把 state/fleet_history.json 回寫(digest 靠它報趨勢/連敗)。
# 跨 repo 讀 run 狀態另靠 FLEET_READ_TOKEN(PAT),預設 GITHUB_TOKEN 不夠。
permissions:
  contents: write

concurrency:
  group: fleet-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    # 實測最長 1.2 分(近 31 次);不設就是吃 360 分鐘預設
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Send fleet digest (fail-soft)
        run: python scripts/fleet_digest.py || true
        env:
          # 跨 repo 讀 Actions run 狀態用的 PAT(fine-grained,Actions: Read-only)。
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          KAI_NOTIFY_BOT_TOKEN: ${{ secrets.KAI_NOTIFY_BOT_TOKEN }}
          KAI_NOTIFY_CHAT_ID: ${{ secrets.KAI_NOTIFY_CHAT_ID }}
      - name: Persist fleet history (non-fatal)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/fleet_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no history change"
          else
            git commit -m "chore: update fleet history [skip ci]"
            git pull --rebase origin main && git push || echo "history push skipped (non-fatal)"
          fi
