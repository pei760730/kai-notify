[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kai-notify"
version = "0.1.0"
description = "Outbound Telegram push core for Kai's AI backend (fail-soft, stdlib-only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["kai_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
